# ==============================================================================
# Production Nginx Configuration for shajjadkhan.com
# Handles HTTP/2, apex-to-www 301 redirect, and static asset caching/compression
# ==============================================================================

# 1. HTTP port 80 -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name shajjadkhan.com www.shajjadkhan.com;
    return 301 https://www.shajjadkhan.com$request_uri;
}

# 2. HTTPS apex (shajjadkhan.com) -> HTTPS canonical www (www.shajjadkhan.com)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shajjadkhan.com;

    ssl_certificate /etc/letsencrypt/live/shajjadkhan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shajjadkhan.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.shajjadkhan.com$request_uri;
}

# 3. HTTPS Canonical WWW (www.shajjadkhan.com)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.shajjadkhan.com;

    ssl_certificate /etc/letsencrypt/live/shajjadkhan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shajjadkhan.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff2;

    # Direct static asset serving with long-lived caching
    location /static/ {
        alias /home/shajjad/p-portfolio/static/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Reverse proxy to local Flask/Gunicorn daemon
    location / {
        proxy_pass http://127.0.0.1:9191;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
