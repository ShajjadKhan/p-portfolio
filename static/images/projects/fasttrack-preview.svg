<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" style="background:#070b16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="ft-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071324" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="ft-emerald-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#00f3ff" />
    </linearGradient>
    <pattern id="ft-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(16, 185, 129, 0.06)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="420" fill="url(#ft-bg-grad)" />
  <rect width="800" height="420" fill="url(#ft-grid)" />

  <!-- Header Strip -->
  <g transform="translate(30, 32)">
    <rect width="240" height="26" rx="13" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#10b981" />
    <text x="26" y="17" fill="#10b981" font-size="11" font-weight="600" letter-spacing="0.5">100% CLIENT-SIDE SANDBOX</text>
    
    <text x="560" y="18" fill="#7a8aa0" font-size="11" font-family="monospace">ZERO SERVER UPLOADS</text>
  </g>

  <!-- Sandbox RAM Boundary (Large visual container) -->
  <rect x="50" y="75" width="700" height="275" rx="12" fill="rgba(255, 255, 255, 0.015)" stroke="rgba(0, 243, 255, 0.25)" stroke-width="1.5" stroke-dasharray="6 6" />
  <text x="70" y="100" fill="#00f3ff" font-size="10" font-weight="700" letter-spacing="1">ISOLATED BROWSER RAM CONTEXT</text>

  <!-- Pipeline Diagram Nodes -->
  <!-- 1. Input Node -->
  <g transform="translate(80, 135)">
    <rect width="170" height="150" rx="10" fill="#0c1626" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <circle cx="28" cy="30" r="12" fill="rgba(0, 243, 255, 0.15)" />
    <path d="M 24 30 L 32 30 M 28 26 L 28 34" stroke="#00f3ff" stroke-width="2" stroke-linecap="round" />
    <text x="48" y="34" fill="#fff" font-size="13" font-weight="700">Source Files</text>
    <text x="20" y="70" fill="#cbd5e1" font-size="11">&bull; PDF Documents</text>
    <text x="20" y="92" fill="#cbd5e1" font-size="11">&bull; AutoCAD DWG/DXF</text>
    <text x="20" y="114" fill="#cbd5e1" font-size="11">&bull; WebP / PNG / JPG</text>
    <rect x="20" y="125" width="130" height="18" rx="4" fill="rgba(0, 243, 255, 0.08)" />
    <text x="85" y="137" fill="#00f3ff" font-size="9" font-family="monospace" text-anchor="middle">Local ArrayBuffer</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 260 210 L 300 210" stroke="#00f3ff" stroke-width="2" stroke-dasharray="3 3" />
  <polygon points="305,210 297,206 297,214" fill="#00f3ff" />

  <!-- 2. Web Worker Execution Node -->
  <g transform="translate(315, 120)">
    <rect width="180" height="180" rx="10" fill="#0c1a2c" stroke="#10b981" stroke-width="1.5" />
    <rect x="15" y="15" width="150" height="24" rx="4" fill="rgba(16, 185, 129, 0.15)" />
    <text x="90" y="31" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">WEB WORKERS THREAD</text>
    
    <text x="20" y="65" fill="#fff" font-size="11" font-weight="600">LibreDWG WebAssembly</text>
    <text x="20" y="80" fill="#7a8aa0" font-size="9">Native CAD Parsing</text>

    <text x="20" y="105" fill="#fff" font-size="11" font-weight="600">PDF-Lib &amp; PDF.js</text>
    <text x="20" y="120" fill="#7a8aa0" font-size="9">In-Memory Merge &amp; Edit</text>

    <text x="20" y="145" fill="#fff" font-size="11" font-weight="600">OffscreenCanvas</text>
    <text x="20" y="160" fill="#7a8aa0" font-size="9">Hardware Accelerated</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 505 210 L 545 210" stroke="#10b981" stroke-width="2" stroke-dasharray="3 3" />
  <polygon points="550,210 542,206 542,214" fill="#10b981" />

  <!-- 3. Output Node -->
  <g transform="translate(560, 135)">
    <rect width="165" height="150" rx="10" fill="#0c1626" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <circle cx="28" cy="30" r="12" fill="rgba(16, 185, 129, 0.15)" />
    <text x="48" y="34" fill="#fff" font-size="13" font-weight="700">Processed Output</text>
    <text x="20" y="70" fill="#cbd5e1" font-size="11">&bull; Instant Download</text>
    <text x="20" y="92" fill="#cbd5e1" font-size="11">&bull; 0 KB Uploaded</text>
    <text x="20" y="114" fill="#cbd5e1" font-size="11">&bull; Zero Cloud Retention</text>
    <rect x="20" y="125" width="125" height="18" rx="4" fill="rgba(16, 185, 129, 0.12)" />
    <text x="82" y="137" fill="#10b981" font-size="9" font-family="monospace" text-anchor="middle">Blob: Instant Save</text>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(210, 368)">
    <rect width="380" height="28" rx="6" fill="rgba(0, 243, 255, 0.08)" stroke="rgba(0, 243, 255, 0.25)" stroke-width="1" />
    <text x="190" y="19" fill="#00f3ff" font-size="11" font-weight="600" text-anchor="middle">50+ Utilities • 100% Client-Side Privacy • Zero Server Latency</text>
  </g>
</svg>
