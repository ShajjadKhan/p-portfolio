<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" style="background:#070b16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="hr-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071526" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <pattern id="hr-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 243, 255, 0.06)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="420" fill="url(#hr-bg-grad)" />
  <rect width="800" height="420" fill="url(#hr-grid)" />

  <!-- Status Header -->
  <g transform="translate(30, 32)">
    <rect width="260" height="26" rx="13" fill="rgba(0, 243, 255, 0.12)" stroke="rgba(0, 243, 255, 0.35)" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#00f3ff" />
    <text x="26" y="17" fill="#00f3ff" font-size="11" font-weight="600" letter-spacing="0.5">BIOMETRIC SYNC &amp; PAYROLL ENGINE</text>
    
    <text x="560" y="18" fill="#7a8aa0" font-size="11" font-family="monospace">PAYROLL: AUTOMATED</text>
  </g>

  <!-- 3-Stage Pipeline Layout -->
  <!-- 1. Biometric Ingestion -->
  <g transform="translate(60, 115)">
    <rect width="190" height="175" rx="10" fill="#0c1626" stroke="rgba(0, 243, 255, 0.3)" stroke-width="1.5" />
    <rect x="15" y="15" width="160" height="24" rx="4" fill="rgba(0, 243, 255, 0.12)" />
    <text x="95" y="31" fill="#00f3ff" font-size="11" font-weight="700" text-anchor="middle">BIOMETRIC HARDWARE</text>

    <text x="16" y="65" fill="#fff" font-size="11" font-weight="600">Multi-Branch Clocks</text>
    <text x="16" y="80" fill="#7a8aa0" font-size="9">ZKTeco API Data Sync</text>

    <text x="16" y="105" fill="#fff" font-size="11" font-weight="600">Shift Normalization</text>
    <text x="16" y="120" fill="#7a8aa0" font-size="9">Overtime &amp; late tolerance</text>

    <rect x="16" y="135" width="158" height="22" rx="4" fill="rgba(16, 185, 129, 0.1)" />
    <text x="95" y="150" fill="#10b981" font-size="9" font-family="monospace" text-anchor="middle">Live Ingestion Active</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 250 200 L 290 200" stroke="#00f3ff" stroke-width="2" stroke-dasharray="3 3" />
  <polygon points="295,200 287,196 287,204" fill="#00f3ff" />

  <!-- 2. Hierarchical Leave Matrix -->
  <g transform="translate(305, 115)">
    <rect width="190" height="175" rx="10" fill="#0c1828" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="15" y="15" width="160" height="24" rx="4" fill="rgba(245, 158, 11, 0.15)" />
    <text x="95" y="31" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle">LEAVE MATRIX (RBAC)</text>

    <text x="16" y="65" fill="#fff" font-size="11" font-weight="600">Multi-Tier Approvals</text>
    <text x="16" y="80" fill="#7a8aa0" font-size="9">Supervisor &rarr; Dept &rarr; HR</text>

    <text x="16" y="105" fill="#fff" font-size="11" font-weight="600">Balance Calculation</text>
    <text x="16" y="120" fill="#7a8aa0" font-size="9">Accrual &amp; deduction rules</text>

    <rect x="16" y="135" width="158" height="22" rx="4" fill="rgba(245, 158, 11, 0.1)" />
    <text x="95" y="150" fill="#f59e0b" font-size="9" font-family="monospace" text-anchor="middle">Audit Logged State</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 495 200 L 535 200" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3" />
  <polygon points="540,200 532,196 532,204" fill="#f59e0b" />

  <!-- 3. Automated Payroll Dispatch -->
  <g transform="translate(550, 115)">
    <rect width="190" height="175" rx="10" fill="#0c1a24" stroke="#10b981" stroke-width="1.5" />
    <rect x="15" y="15" width="160" height="24" rx="4" fill="rgba(16, 185, 129, 0.15)" />
    <text x="95" y="31" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">AUTOMATED PAYROLL</text>

    <text x="16" y="65" fill="#fff" font-size="11" font-weight="600">Salary Computation</text>
    <text x="16" y="80" fill="#7a8aa0" font-size="9">GOSI, tax, &amp; bonus lines</text>

    <text x="16" y="105" fill="#fff" font-size="11" font-weight="600">Encrypted Pay Slips</text>
    <text x="16" y="120" fill="#7a8aa0" font-size="9">Automated PDF generator</text>

    <rect x="16" y="135" width="158" height="22" rx="4" fill="rgba(16, 185, 129, 0.12)" />
    <text x="95" y="150" fill="#10b981" font-size="9" font-family="monospace" text-anchor="middle">100% Reconciled</text>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(220, 368)">
    <rect width="360" height="28" rx="6" fill="rgba(0, 243, 255, 0.08)" stroke="rgba(0, 243, 255, 0.25)" stroke-width="1" />
    <text x="180" y="19" fill="#00f3ff" font-size="11" font-weight="600" text-anchor="middle">Biometric Attendance • Hierarchical Leaves • Automated Pay Slips</text>
  </g>
</svg>
