<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" style="background:#070b16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bt-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="bt-cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <pattern id="bt-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 243, 255, 0.07)" stroke-width="1" />
    </pattern>
    <filter id="bt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Grid -->
  <rect width="800" height="420" fill="url(#bt-bg-grad)" />
  <rect width="800" height="420" fill="url(#bt-grid)" />

  <!-- Coordinates & Status Header -->
  <g transform="translate(30, 32)">
    <rect width="210" height="26" rx="13" fill="rgba(0, 243, 255, 0.1)" stroke="rgba(0, 243, 255, 0.3)" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#00f3ff" />
    <text x="26" y="17" fill="#00f3ff" font-size="11" font-weight="600" letter-spacing="0.5">2D SPATIAL MATRIX ACTIVE</text>
    
    <text x="540" y="18" fill="#7a8aa0" font-size="11" font-family="monospace">POS: (X: +1420, Y: -840) • 60 FPS</text>
  </g>

  <!-- Collision Rings (Dashed physics circles) -->
  <circle cx="400" cy="220" r="140" fill="none" stroke="rgba(0, 243, 255, 0.12)" stroke-width="1.5" stroke-dasharray="4 6" />
  <circle cx="400" cy="220" r="85" fill="none" stroke="rgba(16, 185, 129, 0.15)" stroke-width="1" stroke-dasharray="2 4" />

  <!-- Connecting Vector Links -->
  <path d="M 400 220 Q 280 140 180 140" fill="none" stroke="url(#bt-cyan-grad)" stroke-width="2" stroke-opacity="0.7" />
  <path d="M 400 220 Q 520 140 620 140" fill="none" stroke="url(#bt-cyan-grad)" stroke-width="2" stroke-opacity="0.7" />
  <path d="M 400 220 Q 270 300 170 300" fill="none" stroke="url(#bt-cyan-grad)" stroke-width="2" stroke-opacity="0.7" />
  <path d="M 400 220 Q 530 300 630 300" fill="none" stroke="url(#bt-cyan-grad)" stroke-width="2" stroke-opacity="0.7" />

  <!-- Center Root Node -->
  <g transform="translate(310, 192)" filter="url(#bt-glow)">
    <rect width="180" height="56" rx="10" fill="#0e172a" stroke="#00f3ff" stroke-width="2" />
    <circle cx="24" cy="28" r="8" fill="#00f3ff" />
    <text x="44" y="27" fill="#ffffff" font-size="13" font-weight="700">Root Editorial Node</text>
    <text x="44" y="43" fill="#00f3ff" font-size="10" font-weight="600" font-family="monospace">RADIAL GRAPH MATRIX</text>
  </g>

  <!-- Branch Node 1 (Top Left) -->
  <g transform="translate(90, 115)">
    <rect width="180" height="50" rx="8" fill="#0c1322" stroke="rgba(0, 243, 255, 0.4)" stroke-width="1" />
    <text x="16" y="24" fill="#f1f5f9" font-size="12" font-weight="600">360° Virtual Joystick</text>
    <text x="16" y="39" fill="#7a8aa0" font-size="10">Kinetic Physics Engine</text>
  </g>

  <!-- Branch Node 2 (Top Right) -->
  <g transform="translate(530, 115)">
    <rect width="180" height="50" rx="8" fill="#0c1322" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
    <text x="16" y="24" fill="#f1f5f9" font-size="12" font-weight="600">RFC 6238 TOTP 2FA</text>
    <text x="16" y="39" fill="#10b981" font-size="10">Pre-Driver SQLi Filters</text>
  </g>

  <!-- Branch Node 3 (Bottom Left) -->
  <g transform="translate(80, 275)">
    <rect width="180" height="50" rx="8" fill="#0c1322" stroke="rgba(0, 243, 255, 0.4)" stroke-width="1" />
    <text x="16" y="24" fill="#f1f5f9" font-size="12" font-weight="600">WYSIWYG Studio</text>
    <text x="16" y="39" fill="#7a8aa0" font-size="10">Live Markdown Preview</text>
  </g>

  <!-- Branch Node 4 (Bottom Right) -->
  <g transform="translate(540, 275)">
    <rect width="180" height="50" rx="8" fill="#0c1322" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
    <text x="16" y="24" fill="#f1f5f9" font-size="12" font-weight="600">SQLite WAL Engine</text>
    <text x="16" y="39" fill="#10b981" font-size="10">&lt;15ms Collision Loop</text>
  </g>

  <!-- Bottom Metric Badge -->
  <g transform="translate(240, 370)">
    <rect width="320" height="28" rx="6" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1" />
    <text x="160" y="19" fill="#10b981" font-size="11" font-weight="600" text-anchor="middle">Zero Sibling Overlap • Spatial Search Indexed</text>
  </g>
</svg>
