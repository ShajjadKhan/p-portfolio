<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" style="background:#070b16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="isp-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141108" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <pattern id="isp-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(245, 158, 11, 0.07)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="420" fill="url(#isp-bg-grad)" />
  <rect width="800" height="420" fill="url(#isp-grid)" />

  <!-- Status Header -->
  <g transform="translate(30, 32)">
    <rect width="250" height="26" rx="13" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#f59e0b" />
    <text x="26" y="17" fill="#f59e0b" font-size="11" font-weight="600" letter-spacing="0.5">MIKROTIK ROUTEROS API &amp; AAA</text>
    
    <text x="560" y="18" fill="#7a8aa0" font-size="11" font-family="monospace">THROUGHPUT: 1.2 Gbps</text>
  </g>

  <!-- Network Topology Layout -->
  <!-- 1. MikroTik RouterOS Core -->
  <g transform="translate(70, 110)">
    <rect width="200" height="190" rx="10" fill="#13141f" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="15" y="15" width="170" height="24" rx="4" fill="rgba(245, 158, 11, 0.15)" />
    <text x="100" y="31" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle">ROUTEROS CORE (API:8728)</text>

    <text x="16" y="65" fill="#fff" font-size="11" font-weight="600">Dynamic Queue Shaping</text>
    <text x="16" y="80" fill="#7a8aa0" font-size="9">Bandwidth bursts &amp; rate caps</text>

    <text x="16" y="105" fill="#fff" font-size="11" font-weight="600">Hotspot Captive Portal</text>
    <text x="16" y="120" fill="#7a8aa0" font-size="9">Overdue Walled Garden</text>

    <text x="16" y="145" fill="#fff" font-size="11" font-weight="600">Real-Time User Disconnect</text>
    <text x="16" y="160" fill="#7a8aa0" font-size="9">CoA / POD Automation</text>
  </g>

  <!-- Central Bridge / Bus -->
  <path d="M 270 205 L 340 205" stroke="#f59e0b" stroke-width="2" />
  <circle cx="340" cy="205" r="4" fill="#f59e0b" />

  <!-- 2. FreeRADIUS AAA Engine -->
  <g transform="translate(350, 110)">
    <rect width="180" height="85" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="16" y="28" fill="#fff" font-size="12" font-weight="700">FreeRADIUS Engine</text>
    <text x="16" y="45" fill="#7a8aa0" font-size="10">High-Throughput Accounting</text>
    <text x="16" y="65" fill="#10b981" font-size="10" font-weight="600">&bull; Zero-Loss Packet Logging</text>
  </g>

  <!-- 3. WhatsApp Notification Gateway -->
  <g transform="translate(350, 215)">
    <rect width="180" height="85" rx="8" fill="#0f172a" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
    <text x="16" y="28" fill="#fff" font-size="12" font-weight="700">WhatsApp Gateway</text>
    <text x="16" y="45" fill="#7a8aa0" font-size="10">Automated Invoice Dispatch</text>
    <text x="16" y="65" fill="#10b981" font-size="10" font-weight="600">&bull; Overdue Payment Reminders</text>
  </g>

  <!-- Right Side Subscriber Devices -->
  <g transform="translate(580, 130)">
    <rect width="150" height="150" rx="10" fill="#111827" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="16" y="30" fill="#fff" font-size="12" font-weight="700">Subscribers</text>
    <text x="16" y="55" fill="#cbd5e1" font-size="11">&bull; PPPoE Sessions</text>
    <text x="16" y="78" fill="#cbd5e1" font-size="11">&bull; Hotspot Users</text>
    <text x="16" y="101" fill="#cbd5e1" font-size="11">&bull; Static Fiber Leases</text>
    <rect x="16" y="115" width="118" height="20" rx="4" fill="rgba(245, 158, 11, 0.12)" />
    <text x="75" y="129" fill="#f59e0b" font-size="9" font-family="monospace" text-anchor="middle">Queue Shaping OK</text>
  </g>

  <path d="M 530 152 L 580 170" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="3 3" />
  <path d="M 530 257 L 580 230" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Footer Banner -->
  <g transform="translate(230, 368)">
    <rect width="340" height="28" rx="6" fill="rgba(245, 158, 11, 0.08)" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1" />
    <text x="170" y="19" fill="#f59e0b" font-size="11" font-weight="600" text-anchor="middle">Real-time Provisioning • Automated Disconnects</text>
  </g>
</svg>
