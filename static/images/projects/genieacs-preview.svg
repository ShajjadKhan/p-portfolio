<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" style="background:#070b16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="g-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081816" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <pattern id="g-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(16, 185, 129, 0.07)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="420" fill="url(#g-bg-grad)" />
  <rect width="800" height="420" fill="url(#g-grid)" />

  <!-- Status Header -->
  <g transform="translate(30, 32)">
    <rect width="250" height="26" rx="13" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#10b981" />
    <text x="26" y="17" fill="#10b981" font-size="11" font-weight="600" letter-spacing="0.5">GENIEACS CWMP TR-069 ENGINE</text>
    
    <text x="560" y="18" fill="#7a8aa0" font-size="11" font-family="monospace">STATUS: CARRIER-GRADE</text>
  </g>

  <!-- Architecture Flow -->
  <!-- 1. GenieACS Server Cluster -->
  <g transform="translate(70, 110)">
    <rect width="210" height="190" rx="10" fill="#0d1b1d" stroke="#10b981" stroke-width="1.5" />
    <rect x="15" y="15" width="180" height="24" rx="4" fill="rgba(16, 185, 129, 0.15)" />
    <text x="105" y="31" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">GENIEACS ACS CORE</text>

    <text x="16" y="65" fill="#fff" font-size="11" font-weight="600">CWMP Server Engine</text>
    <text x="16" y="80" fill="#7a8aa0" font-size="9">Node.js, MongoDB &amp; FS</text>

    <text x="16" y="105" fill="#fff" font-size="11" font-weight="600">Zero-Touch Provisioning</text>
    <text x="16" y="120" fill="#7a8aa0" font-size="9">Preset profiles on Inform</text>

    <text x="16" y="145" fill="#fff" font-size="11" font-weight="600">Staged Firmware Updates</text>
    <text x="16" y="160" fill="#7a8aa0" font-size="9">Safety rollback thresholds</text>
  </g>

  <!-- Bi-directional Inform / RPC Arrow -->
  <g transform="translate(305, 175)">
    <rect width="180" height="60" rx="6" fill="#0a1322" stroke="rgba(0, 243, 255, 0.3)" stroke-width="1" />
    <text x="90" y="24" fill="#00f3ff" font-size="10" font-weight="700" text-anchor="middle">CWMP HTTP / SOAP</text>
    <text x="90" y="42" fill="#cbd5e1" font-size="9" text-anchor="middle">&larr; Periodic Inform Loop &rarr;</text>
  </g>
  <path d="M 280 205 L 305 205" stroke="#10b981" stroke-width="2" />
  <path d="M 485 205 L 515 205" stroke="#00f3ff" stroke-width="2" />

  <!-- Fleet of CPE / ONT Devices -->
  <g transform="translate(520, 110)">
    <rect width="210" height="190" rx="10" fill="#0b1322" stroke="rgba(0, 243, 255, 0.3)" stroke-width="1.5" />
    <rect x="15" y="15" width="180" height="24" rx="4" fill="rgba(0, 243, 255, 0.12)" />
    <text x="105" y="31" fill="#00f3ff" font-size="11" font-weight="700" text-anchor="middle">SUBSCRIBER CPE FLEET</text>

    <text x="16" y="65" fill="#fff" font-size="11" font-weight="600">Fiber GPON ONTs</text>
    <text x="16" y="80" fill="#10b981" font-size="9">Optical Rx: -18.4 dBm (Normal)</text>

    <text x="16" y="105" fill="#fff" font-size="11" font-weight="600">Dual-Band Wi-Fi Routers</text>
    <text x="16" y="120" fill="#cbd5e1" font-size="9">SSID &amp; Radio Param Sync</text>

    <text x="16" y="145" fill="#fff" font-size="11" font-weight="600">Live Diagnostics</text>
    <text x="16" y="160" fill="#7a8aa0" font-size="9">Remote reboot &amp; ping test</text>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(210, 368)">
    <rect width="380" height="28" rx="6" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1" />
    <text x="190" y="19" fill="#10b981" font-size="11" font-weight="600" text-anchor="middle">Automated Firmware Pipelines • Live Telemetry &amp; Fault Detection</text>
  </g>
</svg>
