<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" style="background:#070b16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="tf-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="tf-emerald-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#00f3ff" />
    </linearGradient>
    <linearGradient id="tf-gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <pattern id="tf-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(16, 185, 129, 0.05)" stroke-width="1" />
    </pattern>
    <filter id="tf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="440" fill="url(#tf-bg-grad)" />
  <rect width="900" height="440" fill="url(#tf-grid)" />

  <!-- Top Status Bar -->
  <g transform="translate(36, 28)">
    <rect width="250" height="26" rx="13" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#10b981" />
    <text x="26" y="17" fill="#10b981" font-size="11" font-weight="700" letter-spacing="0.5">TAWREEDFLOW ARCHITECTURE</text>
    
    <text x="590" y="18" fill="#7a8aa0" font-size="11" font-family="monospace">SOVEREIGN GCC TENANT &bull; ZATCA PHASE 2</text>
  </g>

  <!-- Connecting Pipeline Bus Lines -->
  <path d="M 120 180 L 780 180" fill="none" stroke="rgba(16, 185, 129, 0.2)" stroke-width="3" stroke-dasharray="6 6" />
  <path d="M 120 280 L 780 280" fill="none" stroke="rgba(0, 243, 255, 0.2)" stroke-width="3" stroke-dasharray="6 6" />

  <!-- Stage 1: Department Requisition -->
  <g transform="translate(40, 110)">
    <rect width="145" height="180" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5" />
    <rect width="145" height="32" rx="10" fill="rgba(16, 185, 129, 0.15)" />
    <text x="12" y="21" fill="#10b981" font-size="11" font-weight="700">1. REQUISITION</text>

    <!-- Content -->
    <text x="14" y="58" fill="#f1f5f9" font-size="11" font-weight="600">Department Requisition</text>
    <text x="14" y="74" fill="#94a3b8" font-size="9.5">Executive Chef &bull; Eng &bull; HK</text>

    <rect x="14" y="92" width="117" height="24" rx="4" fill="rgba(255, 255, 255, 0.05)" />
    <text x="22" y="108" fill="#38bdf8" font-size="9" font-family="monospace">Catalog Item Masters</text>

    <rect x="14" y="124" width="117" height="24" rx="4" fill="rgba(255, 255, 255, 0.05)" />
    <text x="22" y="140" fill="#cbd5e1" font-size="9" font-family="monospace">WhatsApp Requisitions</text>

    <circle cx="72" cy="165" r="3" fill="#10b981" />
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 185 200 L 215 200" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Stage 2: Approval Matrix -->
  <g transform="translate(210, 110)">
    <rect width="145" height="180" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5" />
    <rect width="145" height="32" rx="10" fill="rgba(245, 158, 11, 0.15)" />
    <text x="12" y="21" fill="#f59e0b" font-size="11" font-weight="700">2. APPROVAL MATRIX</text>

    <text x="14" y="58" fill="#f1f5f9" font-size="11" font-weight="600">Dynamic Tier Matrix</text>
    <text x="14" y="74" fill="#94a3b8" font-size="9.5">Multi-property routing</text>

    <rect x="14" y="92" width="117" height="24" rx="4" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(245, 158, 11, 0.2)" />
    <text x="22" y="108" fill="#f59e0b" font-size="9" font-family="monospace">Budget Cap Audit</text>

    <rect x="14" y="124" width="117" height="24" rx="4" fill="rgba(255, 255, 255, 0.05)" />
    <text x="22" y="140" fill="#cbd5e1" font-size="9" font-family="monospace">GM &bull; CFO Sign-off</text>

    <circle cx="72" cy="165" r="3" fill="#f59e0b" />
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 355 200 L 385 200" fill="none" stroke="#f59e0b" stroke-width="2" />

  <!-- Stage 3: RFQ & Bidding -->
  <g transform="translate(380, 110)">
    <rect width="145" height="180" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(0, 243, 255, 0.3)" stroke-width="1.5" />
    <rect width="145" height="32" rx="10" fill="rgba(0, 243, 255, 0.15)" />
    <text x="12" y="21" fill="#00f3ff" font-size="11" font-weight="700">3. VENDOR RFQ BID</text>

    <text x="14" y="58" fill="#f1f5f9" font-size="11" font-weight="600">Quote Normalization</text>
    <text x="14" y="74" fill="#94a3b8" font-size="9.5">Supplier B2B Portal</text>

    <rect x="14" y="92" width="117" height="24" rx="4" fill="rgba(0, 243, 255, 0.1)" />
    <text x="22" y="108" fill="#00f3ff" font-size="9" font-family="monospace">Comparative Bids</text>

    <rect x="14" y="124" width="117" height="24" rx="4" fill="rgba(255, 255, 255, 0.05)" />
    <text x="22" y="140" fill="#cbd5e1" font-size="9" font-family="monospace">Substitute Flagging</text>

    <circle cx="72" cy="165" r="3" fill="#00f3ff" />
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 525 200 L 555 200" fill="none" stroke="#00f3ff" stroke-width="2" />

  <!-- Stage 4: 3-Way Dock Reconciliation -->
  <g transform="translate(550, 110)">
    <rect width="145" height="180" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1.5" />
    <rect width="145" height="32" rx="10" fill="rgba(16, 185, 129, 0.15)" />
    <text x="12" y="21" fill="#10b981" font-size="11" font-weight="700">4. 3-WAY MATCH</text>

    <text x="14" y="58" fill="#f1f5f9" font-size="11" font-weight="600">Dock Reconciliation</text>
    <text x="14" y="74" fill="#94a3b8" font-size="9.5">PO &harr; GRN &harr; Invoice</text>

    <rect x="14" y="92" width="117" height="24" rx="4" fill="rgba(16, 185, 129, 0.1)" />
    <text x="22" y="108" fill="#34d399" font-size="9" font-family="monospace">Mobile Receiving</text>

    <rect x="14" y="124" width="117" height="24" rx="4" fill="rgba(255, 255, 255, 0.05)" />
    <text x="22" y="140" fill="#cbd5e1" font-size="9" font-family="monospace">Price Drift Check</text>

    <circle cx="72" cy="165" r="3" fill="#34d399" />
  </g>

  <!-- Arrow 4 to 5 -->
  <path d="M 695 200 L 725 200" fill="none" stroke="#34d399" stroke-width="2" />

  <!-- Stage 5: ZATCA Phase 2 Clearance -->
  <g transform="translate(720, 110)">
    <rect width="145" height="180" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(167, 139, 250, 0.35)" stroke-width="1.5" />
    <rect width="145" height="32" rx="10" fill="rgba(167, 139, 250, 0.15)" />
    <text x="12" y="21" fill="#a78bfa" font-size="11" font-weight="700">5. ZATCA CLEAR</text>

    <text x="14" y="58" fill="#f1f5f9" font-size="11" font-weight="600">Sovereign Compliance</text>
    <text x="14" y="74" fill="#94a3b8" font-size="9.5">FATOORA E-Invoicing</text>

    <rect x="14" y="92" width="117" height="24" rx="4" fill="rgba(167, 139, 250, 0.1)" />
    <text x="22" y="108" fill="#c084fc" font-size="9" font-family="monospace">XML UBL 2.1 &bull; QR</text>

    <rect x="14" y="124" width="117" height="24" rx="4" fill="rgba(255, 255, 255, 0.05)" />
    <text x="22" y="140" fill="#cbd5e1" font-size="9" font-family="monospace">Cryptographic Hash</text>

    <circle cx="72" cy="165" r="3" fill="#a78bfa" />
  </g>

  <!-- Measured Outcomes Strip at Bottom -->
  <g transform="translate(40, 320)">
    <rect width="825" height="85" rx="10" fill="rgba(10, 16, 30, 0.95)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <g transform="translate(24, 20)">
      <text x="0" y="18" fill="#10b981" font-size="18" font-weight="800">&lt; 3.5 Hours</text>
      <text x="0" y="38" fill="#7a8aa0" font-size="10" font-weight="600" text-transform="uppercase">PO Approval Cycle</text>
      <text x="0" y="52" fill="#94a3b8" font-size="9.5">Down from 4.2 days</text>
    </g>

    <line x1="220" y1="18" x2="220" y2="68" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <g transform="translate(240, 20)">
      <text x="0" y="18" fill="#f59e0b" font-size="18" font-weight="800">SAR 180,000+</text>
      <text x="0" y="38" fill="#7a8aa0" font-size="10" font-weight="600" text-transform="uppercase">Spend Leakage Stopped</text>
      <text x="0" y="52" fill="#94a3b8" font-size="9.5">Per hotel property annually</text>
    </g>

    <line x1="440" y1="18" x2="440" y2="68" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <g transform="translate(460, 20)">
      <text x="0" y="18" fill="#00f3ff" font-size="18" font-weight="800">94% Fewer Disputes</text>
      <text x="0" y="38" fill="#7a8aa0" font-size="10" font-weight="600" text-transform="uppercase">3-Way Dock Verification</text>
      <text x="0" y="52" fill="#94a3b8" font-size="9.5">Zero unverified receipts</text>
    </g>

    <line x1="650" y1="18" x2="650" y2="68" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <g transform="translate(670, 20)">
      <text x="0" y="18" fill="#a78bfa" font-size="18" font-weight="800">100% Phase 2</text>
      <text x="0" y="38" fill="#7a8aa0" font-size="10" font-weight="600" text-transform="uppercase">ZATCA Clearance</text>
      <text x="0" y="52" fill="#94a3b8" font-size="9.5">Automated signed XML</text>
    </g>
  </g>
</svg>
